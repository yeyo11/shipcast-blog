# Builds the blog and publishes it on GitHub Pages on every push to main, which includes merging a
# Shipcast drafts pull request: the merge is what publishes the article.
#
# Turn it on once: Settings > Pages > Build and deployment > Source: GitHub Actions.
# The address comes from Pages itself (https://<you>.github.io/<repo>/, or your custom domain), so the
# site and its base path need no setting. Without Pages, the build still runs and says so.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      pages: ${{ steps.pages.outcome }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Read the Pages address
        id: pages
        uses: actions/configure-pages@v6
        # Pages off (or not available to this repo): build anyway, at brand.yml's site
        continue-on-error: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - name: Build
        run: pnpm build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          # Only raises GitHub's rate limit for the project pages' star counts; never required
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outcome == 'success'
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.pages == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
